[project]
name = "prior-auth-copilot"
version = "0.1.0"
description = "Prior authorization copilot: checks a GLP-1 request against payer criteria using the patient chart from a FHIR server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
